name: Actualizar Observatorio

# ============================================================
# PIPELINE ORQUESTADO
# ============================================================
# Cada lunes a las 12:00 UTC (6:00 am tiempo del centro de Mexico)
# este workflow:
#   1. Descarga datos frescos del Banco Mundial
#   2. Recarga DuckDB
#   3. Ejecuta las 15 queries SQL
#   4. Genera las 4 graficas PNG
#   5. Si hay cambios respecto a la version commiteada, los commitea
#      automaticamente con un mensaje fechado
#   6. Si el pipeline falla, abre un issue en el repo para alertar
#
# Tambien se puede correr a mano desde la pestana Actions (workflow_dispatch).
# ============================================================

on:
  schedule:
    - cron: '0 12 * * 1'   # cada lunes 12:00 UTC
  workflow_dispatch:        # ejecucion manual desde la UI de GitHub

permissions:
  contents: write           # para que el bot commitee resultados nuevos
  issues:   write           # para abrir issue si algo falla

concurrency:
  group: actualizar-observatorio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # historial completo para que git log/commit funcione

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pipeline ETL completo
        run: |
          echo "::group::1/4 Descargar indicadores del Banco Mundial"
          python descargar_datos.py
          echo "::endgroup::"

          echo "::group::2/4 Cargar a DuckDB"
          python cargar_db.py
          echo "::endgroup::"

          echo "::group::3/4 Ejecutar 15 queries SQL"
          python correr_analisis.py
          echo "::endgroup::"

          echo "::group::4/4 Generar graficas PNG"
          python generar_graficas.py
          echo "::endgroup::"

      - name: Detectar si hay cambios
        id: cambios
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: el Banco Mundial no publico actualizaciones esta semana."
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            echo "Cambios detectados:"
            git status --short
          fi

      - name: Commit y push automatico
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fecha=$(date -u +%Y-%m-%d)
          git add -A
          git commit -m "chore: actualizacion automatica del observatorio ($fecha)

          Workflow: ${{ github.workflow }}
          Run:      ${{ github.run_id }}
          Trigger:  ${{ github.event_name }}"
          git push

      - name: Resumen final
        if: always()
        run: |
          echo "### Resumen del run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hay cambios: \`${{ steps.cambios.outputs.hay_cambios }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fecha UTC: \`$(date -u)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir issue si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fecha = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Pipeline fallo el ${fecha}`,
              body:  [
                'El workflow **Actualizar Observatorio** termino con error.',
                '',
                `- Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `- Trigger: \`${context.eventName}\``,
                `- Branch: \`${context.ref}\``,
                '',
                'Revisa los logs y vuelve a disparar el workflow una vez resuelto.',
              ].join('\n'),
              labels: ['pipeline', 'automated']
            });
